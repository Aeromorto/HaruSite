name: Publish static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble V6.0 and earlier versions
        run: |
          set -eu
          mkdir -p _site
          cp -a index.html escova.html kit.html suporte.html microplasticos.html uso.html privacidade.html termos.html css js fonts images .nojekyll _site/
          for dir in v2 v3 v4 v5 v5.5 v5.8; do
            cp -a "$dir" "_site/$dir"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
