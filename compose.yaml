name: haru-migration
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haru
      POSTGRES_PASSWORD: haru_dev
      POSTGRES_DB: haru
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - haru_postgres:/var/lib/postgresql/data
      - ./scripts/docker-test-db.sql:/docker-entrypoint-initdb.d/test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haru -d haru"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  haru_postgres:
